---
name: checks

on:
  push:
    branches:
      - main2
  pull_request:
    branches:
      - main2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version

      - name: shellcheck (job entrypoints + gates + focused test scripts)
        # Lint every jobs/ entrypoint, including usage-meter.sh, so adding a
        # new production job script cannot silently bypass this required gate.
        # The nested scripts/jobs/{handlers,gardening,test}/ trees remain
        # excluded from shellcheck for now: their existing findings need a
        # separate, behavior-sensitive cleanup. bash -n below still checks
        # their syntax, and the focused job tests listed here stay linted.
        run: |
          shellcheck -S warning \
            scripts/jobs/*.sh \
            scripts/daemons/start.sh \
            scripts/daemons/stop.sh \
            scripts/daemons/status.sh \
            scripts/daemons/logs.sh \
            scripts/daemons/config.sh.example \
            scripts/watcher/endo-but-for-bots/watcher.sh \
            scripts/checks/run-all.sh \
            scripts/checks/bench-engines-rename/check.sh \
            scripts/checks/double-space-sentence-separator/check.sh \
            scripts/checks/maintainer-inbox-information-hiding/check.sh \
            scripts/checks/claude-md-inventory-drift/check.sh \
            skills/gardener-inbox-error-reporting/report-error.sh \
            tests/checks/run.sh \
            tests/checks/test_bench_engines_rename.sh \
            tests/checks/test_double_space_sentence_separator.sh \
            tests/checks/test_maintainer_inbox_information_hiding.sh \
            tests/checks/test_claude_md_inventory_drift.sh \
            tests/checks/test_run_all.sh \
            tests/checks/test_identity_drift_guard.sh \
            tests/checks/test_state_clone_keeper.sh \
            scripts/jobs/test/identity-drift-guard-test.sh \
            scripts/jobs/test/report-error-reachable-test.sh

      - name: bash -n (syntax check, all scripts/ and skill main scripts)
        # Syntactic check on every shell script under scripts/ and skills/.
        # `bash -n` is purely lexical so it is safe to run on the broader
        # set, unlike shellcheck which surfaces warnings the surrounding
        # scripts have not addressed yet.
        run: |
          set -eu
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n failed"
              fail=1
            fi
          done < <(find scripts skills -mindepth 2 -maxdepth 4 -type f -name '*.sh' | sort)
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Run pre-dispatch grep-gate tests
        run: bash tests/checks/run.sh
