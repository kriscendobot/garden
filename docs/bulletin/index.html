<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garden bulletin</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22><text y=%228%22 font-size=%228%22>🥕</text></svg>"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Garden bulletin</h1>
      <div class="controls">
        <div id="authbar" class="authbar"></div>
        <button id="refresh" class="linkbtn">refresh</button>
      </div>
      <p class="sub">
        Live view of <code>journal2:README.md</code>. Open a new thread to the
        liaison, or reply to a maintainer-inbox message below — each commits to
        <code>journal2</code>.
        <a href="SETUP.md" target="_blank" rel="noopener">setup</a> ·
        <a href="DESIGN.md" target="_blank" rel="noopener">design</a>
      </p>
    </header>

    <main>
      <section id="compose-section">
        <h2>New thread to the liaison</h2>
        <div class="compose">
          <textarea
            id="compose-body"
            rows="3"
            placeholder="Open a new thread to the liaison — commits a message to journal2 inbox/liaison…"
          ></textarea>
          <div class="reply-actions">
            <button id="compose-send" class="btn">Post to liaison</button>
            <span id="compose-status" class="status"></span>
            <span class="muted">or</span>
            <a id="new-issue-link" class="linkbtn" target="_blank" rel="noopener"
              >open a GitHub issue</a
            >
          </div>
        </div>
      </section>

      <section id="inbox-section">
        <h2>Reply to maintainer messages</h2>
        <div id="inbox"></div>
      </section>

      <section id="bulletin-section">
        <h2>Bulletin</h2>
        <article id="bulletin"><p class="muted">loading bulletin…</p></article>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="markdown.js"></script>
    <script src="github.js"></script>
    <script src="app.js"></script>
  </body>
</html>
